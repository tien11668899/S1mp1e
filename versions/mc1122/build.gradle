// S1mp1e Client — 1.12.2 line.
// A port of LiquidGlass26 (the 26.2 mod) onto MC 1.8.9's OpenGL 2.1 stack.
// Same measured Apple parameters, same Snell refraction model, same springs —
// only the plumbing differs (GLSL 120 + immediate mode instead of blaze3d).
//
// Toolchain: JDK8 + Gradle 4.10.3 + ForgeGradle 2.3-SNAPSHOT.
// Forge 14.23.5.2847 (NOT 2859: that build publishes only the userdev3
// classifier, which FG2.3 never asks for — it looks for plain -userdev.jar).
//   $env:JAVA_HOME="C:\Temp\jdk8dl\jdk8u502-b07"; .\gradlew.bat build

buildscript {
    repositories {
        mavenCentral()
        maven { name = "forge";  url = "https://maven.minecraftforge.net/" }
        maven { name = "sponge"; url = "https://repo.spongepowered.org/maven" }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '2.3-SNAPSHOT', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version          = "0.1.0"
group            = "dev.s1mp1e"
archivesBaseName = "s1mp1e-1.12.2"

sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
compileJava.options.encoding = 'UTF-8'

minecraft {
    version  = "1.12.2-14.23.5.2847"
    runDir   = "run"
    mappings = "snapshot_20180814"

    // Dev-only: FML ignores the FMLCorePlugin manifest entry of a classes DIRECTORY
    // (as runClient loads them), so the coremod never runs in dev unless the game JVM
    // is told about it explicitly. This affects runClient ONLY — the built jar carries
    // the FMLCorePlugin manifest attribute and is completely unaffected by this line.
    clientJvmArgs += ['-Dfml.coreMods.load=dev.s1mp1e.glass.asm.S1mp1eLoadingPlugin']
}

jar {
    manifest {
        attributes(
            'Implementation-Title'  : 'S1mp1e Client',
            'Implementation-Version': project.version,
            // Coremod: Forge 1.8.9 has no button-render event and no way to
            // cancel a container's background blit, so the glass has to replace
            // them in bytecode. FMLCorePluginContainsFMLMod tells FML the same
            // jar also carries a normal @Mod.
            'FMLCorePlugin'                 : 'dev.s1mp1e.glass.asm.S1mp1eLoadingPlugin',
            'FMLCorePluginContainsFMLMod'   : 'true'
        )
    }
}

processResources {
    inputs.property "version",   project.version
    inputs.property "mcversion", project.minecraft.version
    // mcmod.info is UTF-8 (the description carries an em-dash). Gradle's expand()
    // otherwise filters it through the platform charset (Windows-1252), which
    // mangles the multibyte char into mojibake in the shipped mods-list entry.
    filteringCharset = 'UTF-8'
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
