// S1mp1e Client — 1.19.2 line (Fabric).
// The glass render layer is the core-profile port (GLSL 150 core + RenderSystem
// shaders) shared with the 1.17.1+ lines — 1.19.2 has the OpenGL 3.2 core
// pipeline, so the fixed-function code of the 1.8.9/1.12.2 lines does not apply.
// Only the plumbing changes vs 1.20.1: GUI uses MatrixStack + DrawableHelper
// instead of DrawContext, and a handful of widget/screen API shifts.
//
// Toolchain: Java 17 target via --release 17, Gradle 8.10 + Loom 1.7.4 on JDK21.
plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

// 1.19.2 runs on Java 17; emit Java-17 bytecode.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Dev runs only: force-load the GUI mixin targets at startup so a broken injection fails immediately.
loom {
    runs {
        client {
            vmArg "-Ds1mp1e.preloadMixinTargets=true"
        }
    }
}

