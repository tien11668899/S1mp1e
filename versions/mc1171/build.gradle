// S1mp1e Client — 1.17.1 line (Fabric).
// The glass render layer is the core-profile port (GLSL 150 core + RenderSystem
// shaders) shared with the later Fabric lines — 1.17.1 is the first OpenGL 3.2
// core-profile version, so the fixed-function code of the 1.8.9/1.12.2/1.16.5
// lines does not apply. GUI uses MatrixStack + DrawableHelper (no DrawContext).
//
// Toolchain: Java 16 target via --release 16, Gradle 8.10 + Loom 1.7.4 on JDK21.
plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Sodium's own options screen is restyled by the (optional, Sodium-gated) compat mixins; compile against it only.
    // The copy in libs/compat is the launcher's Sodium 0.3.4 jar (mc1.17.1-0.3.4+build.13) with its nested jars
    // dropped (it was built with an older Loom, so the Loom stamp needs no lowering). For a dev run drop the
    // ORIGINAL jar into run/mods (it needs fabricloader >= 0.8, satisfied by 0.15.11).
    modCompileOnly files('libs/compat/sodium-0.3.4-compile.jar')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

// 1.17.1 runs on Java 16; emit Java-16 bytecode.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 16
    it.options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_16
    targetCompatibility = JavaVersion.VERSION_16
}

// Dev runs only: force-load the GUI mixin targets at startup so a broken injection fails immediately.
loom {
    runs {
        client {
            vmArg "-Ds1mp1e.preloadMixinTargets=true"
        }
    }
}

