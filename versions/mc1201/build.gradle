// S1mp1e Client — 1.16.5 line (Fabric).
// The glass render layer (4 GLSL-120 programs + immediate-mode GlassRenderer)
// is the SAME code as the 1.8.9/1.12.2 lines — 1.16.5 still has the fixed-
// function pipeline (glBegin/glEnd, gl_ModelViewProjectionMatrix, gl_Color).
// Only the plumbing changes: Forge coremod/events -> Fabric mixins + entrypoint,
// and MC API names go yarn (Minecraft->MinecraftClient, ResourceLocation->
// Identifier, mc.displayWidth->mc.getWindow().getWidth()).
//
// Toolchain: JDK8 target via --release 8, Gradle 8.10 + Loom 1.7 on JDK21.
plugins {
    id 'fabric-loom' version '1.7.4'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Sodium's own options screen is restyled by the (optional, Sodium-gated) compat mixins; compile against it only.
    // The copy in libs/compat is the launcher's Sodium 0.5.13 jar with its Loom version stamp lowered to this
    // project's (Loom 1.7.4 refuses to remap a jar built by a newer Loom) and its nested jars dropped. For a dev run
    // drop the ORIGINAL jar into run/mods (it needs fabricloader >= 0.12, satisfied by 0.15.11).
    modCompileOnly files('libs/compat/sodium-0.5.13-compile.jar')
    // Compile-only: Essential's Elementa + UniversalCraft (+ Kotlin stdlib), for the liquid-glass restyle and zh_TW
    // translation of Essential's UI (s1mp1e.essential.mixins.json, @Pseudo targets). Our mixins touch no member with a
    // Minecraft type, so the intermediary-named UniversalCraft jar compiles as plain files (the 1.21 build: the classes
    // and members used are the same in Essential 1.5.1 for 1.20.1). Never bundled.
    compileOnly files('libs/compat/essential/elementa-745.jar', 'libs/compat/essential/universalcraft-1.21-fabric-505.jar', 'libs/compat/essential/kotlin-stdlib-2.3.0.jar')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

// 1.16.5 runs on Java 8; emit Java-8 bytecode.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


// Dev runs only: force-load the GUI mixin targets at startup so a broken injection fails immediately.
loom {
    runs {
        client {
            vmArg "-Ds1mp1e.preloadMixinTargets=true"
            // production loads mods in mod-id order; dev shuffles it — keep dev identical (Essential compat relies on it)
            vmArg "-Dfabric.debug.disableModShuffle=true"
        }
    }
}
