<style>
html, body { background: #000000 !important; color: #ffffff; }
html, body { background: #000000; background: var(--bg, #000000); color: #ffffff; color: var(--text, #ffffff); }

:root {
    --bg: #000000;
    --text: #ffffff;
    --muted: #9a9a9a;
    --stat: #d8d8d8;
    --border: rgba(255, 255, 255, 0.16);
    --border-soft: rgba(255, 255, 255, 0.12);

    --logo-mark: 22px;
    --nav: 14px;
    --nav-h: 40px;
    --btn: 13.5px;
    --btn-h: 40px;
    --hero-btn-h: 42px;
    --h1: 48px;
    --lede: 15.5px;
    --badge: 12.5px;
    --stat-size: 13.5px;

    --header-x: 40px;

    --hero-gap: 85px;
    --copy-max: 860px;

               system-ui, sans-serif;
    --font-serif: "Instrument Serif", "PingFang TC", "Times New Roman", Times, serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    position: relative;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; border: none; background: none; cursor: pointer; }

/* Ambient background */
.hero-photo {
    position: fixed; inset: 0; z-index: 0;
    background:
        radial-gradient(ellipse at 25% 15%, rgba(94, 92, 230, 0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 78% 68%, rgba(10, 132, 255, 0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(191, 90, 242, 0.06) 0%, transparent 60%),
        #000;
}
.hero-photo::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 25%, transparent 70%, rgba(0,0,0,0.6) 100%);
}
.grain {
    position: fixed; inset: 0; z-index: 100;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.9'/></svg>");
}

.page {
    position: relative; z-index: 1;
    display: grid; grid-template-rows: auto 1fr auto;
    min-height: 100vh;
    min-height: 100dvh;
}

/* Header */
.header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: var(--header-y) var(--header-x) 10px;
    position: relative;
    z-index: 50;
}
.logo {
    display: inline-flex; align-items: center; gap: 9px;
    justify-self: start;
    font-size: var(--logo); font-weight: 600;
    letter-spacing: -0.03em; color: #fff;
}
.logo img {
    width: var(--logo-mark); height: var(--logo-mark);
    border-radius: 6px;
}
.logo-suffix { font-weight: 400; color: rgba(255,255,255,0.75); }

nav.nav {
    display: flex; align-items: center; gap: 8px;
    justify-self: center;
}
.nav a {
    height: var(--nav-h); padding: 0 18px;
    display: inline-flex; align-items: center;
    border-radius: 7px; position: relative; overflow: hidden;
    border: 1px solid rgba(198, 198, 198, 0.55);
    background: linear-gradient(105deg, #050505 0%, #2a2a2a 48%, #4a4a4a 100%);
    color: #f3f3f3;
    font-size: var(--nav); font-weight: 400;
    letter-spacing: -0.01em; white-space: nowrap;
    transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}
.nav a::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.16) 50%, transparent 70%);
    transform: translateX(-120%);
    transition: transform 0.6s ease;
}
.nav a:hover {
    border-color: rgba(235, 235, 235, 0.9);
    background: linear-gradient(105deg, #111 0%, #3a3a3a 45%, #6a6a6a 100%);
    box-shadow: 0 0 18px rgba(200, 210, 230, 0.18);
}
.nav a:hover::before { transform: translateX(120%); }

.header-cta { justify-self: end; }

/* Buttons */
.btn {
    position: relative; isolation: isolate; overflow: hidden;
    display: inline-flex; align-items: center; justify-content: center;
    height: var(--btn-h); padding: 0 16px;
    border-radius: 6px;
    font-size: var(--btn); font-weight: 500;
    letter-spacing: -0.02em; line-height: 1;
    white-space: nowrap; cursor: pointer;
    transition: background 0.35s ease, border-color 0.35s ease,
                box-shadow 0.35s ease, color 0.35s ease, filter 0.35s ease;
}
.btn::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.45) 48%, transparent 76%);
    transform: translateX(-130%);
    transition: transform 0.65s ease;
}
.btn:hover::after { transform: translateX(130%); }

.btn-solid {
    background: linear-gradient(180deg, #ffffff 0%, #e7e7e7 48%, #cfcfcf 100%);
    color: #111; border: 1px solid #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95);
}
.btn-solid:hover {
    background: linear-gradient(180deg, #ffffff 0%, #f3f6ff 42%, #d5def2 100%);
    border-color: #f2f6ff;
    box-shadow: inset 0 1px 0 #fff, 0 0 22px rgba(186,208,255,0.35), 0 8px 18px rgba(255,255,255,0.12);
}
.hero-solid.btn-solid:hover {
    box-shadow: inset 0 1px 0 #fff, 0 0 26px rgba(186,208,255,0.4), 0 8px 18px rgba(255,255,255,0.14);
}

.btn-ghost {
    background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.45) 50%, rgba(160,175,200,0.08));
    color: #fff;
    border: 1px solid rgba(198,198,198,0.45);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
}
.btn-ghost:hover {
    background: linear-gradient(135deg, rgba(210,225,255,0.18), rgba(0,0,0,0.35) 48%, rgba(180,195,220,0.16));
    border-color: rgba(220,230,255,0.75);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 0 20px rgba(170,200,255,0.22);
}

.hero-ghost {
    background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(0,0,0,0.5) 46%, rgba(150,170,200,0.1));
    border: 1px solid rgba(198,198,198,0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
}
.hero-ghost:hover {
    border-color: rgba(220,230,255,0.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 0 24px rgba(170,200,255,0.28);
}

.hero-actions .btn { height: var(--hero-btn-h); padding: 0 18px; }

/* Burger (mobile) */
.burger {
    display: none;
    width: 42px; height: 42px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: rgba(8,8,8,0.55);
    justify-self: end;
    align-items: center; justify-content: center; gap: 5px;
    flex-direction: column;
    z-index: 60;
    transition: border-color 0.2s, background 0.2s;
}
.burger:hover { border-color: rgba(255,255,255,0.32); background: rgba(255,255,255,0.05); }
.burger span {
    display: block;
    width: 16px; height: 1.5px;
    background: #fff; border-radius: 1px;
    transition: transform 0.25s ease, opacity 0.2s ease;
}
body.menu-open .burger span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
body.menu-open .burger span:nth-child(2) { opacity: 0; }
body.menu-open .burger span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.menu-backdrop { display: none; }

/* Hero */
.hero {
    display: flex; align-items: flex-end; justify-content: center;
    padding: 8px 24px var(--hero-gap);
    min-height: 0;
}
.hero-copy {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    max-width: var(--copy-max); width: 100%;
}
.badge {
    display: inline-flex; align-items: center; gap: 8px;
    margin-bottom: 22px;
    padding: 9px 15px;
    border: 0; border-radius: 5px;
    background: linear-gradient(90deg, #7d7d7d 0%, #2a2a2a 52%, #0a0a0a 100%);
    color: #f2f2f2;
    font-size: var(--badge); font-weight: 400;
    letter-spacing: -0.01em;
}
.badge-star { filter: drop-shadow(0 0 3px rgba(255,255,255,0.45)); }

.hero h1 {
    font-family: var(--font-ui);
    font-weight: 500;
    letter-spacing: -0.045em;
    line-height: 1.12;
    color: #fff;
    font-size: var(--h1);
    display: flex; flex-direction: column;
    align-items: center;
}
.headline-line {
    display: block; overflow: hidden;
    padding: 0.06em 0.15em 0.14em;
}
.hero h1 em {
    font-family: var(--font-serif);
    font-style: italic; font-weight: 400;
    font-size: 1.08em;
    letter-spacing: -0.03em;
    color: #9a9a9a;
}

.lede {
    max-width: var(--lede-max);
    margin-top: 18px;
    color: var(--muted);
    font-size: var(--lede);
    font-weight: 400;
    line-height: 1.55;
    letter-spacing: -0.015em;
}

.hero-actions {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 10px; margin-top: 26px;
}

/* Stats */
.stats {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
    padding: 0 var(--stats-x) var(--stats-y);
    padding-bottom: max(var(--stats-y), env(safe-area-inset-bottom));
    color: var(--stat);
}
.stat {
    display: inline-flex; align-items: center; gap: 14px;
    font-size: var(--stat-size);
    letter-spacing: -0.015em; white-space: nowrap;
}
.stat svg { color: #e8e8e8; }

/* Appear */
.appear { opacity: 1; }
.appear:not(.is-in) {
    animation-name: in-scale;
    animation-duration: 1.05s;
    animation-fill-mode: both;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    animation-delay: var(--d, 0.08s);
}
.appear.is-in {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
    clip-path: none !important;
    filter: none !important;
}
.hero-photo.is-in { opacity: 1; }

.appear--scale:not(.is-in) { animation-name: in-scale; }
.appear--soft:not(.is-in)  { animation-name: in-soft; }
.appear--pop:not(.is-in)   { animation-name: in-pop; }
.appear--mask:not(.is-in)  { animation-name: in-mask; }
.appear--btn:not(.is-in)   { animation-name: in-btn; }
.appear--side:not(.is-in)  { animation-name: in-side; }
.appear--stat:not(.is-in)  { animation-name: in-stat; }

@keyframes in-scale { from { opacity: 0; transform: scale(0.84); } to { opacity: 1; transform: scale(1); } }
@keyframes in-soft  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes in-mask  { from { opacity: 0; transform: translateY(40%); } to { opacity: 1; transform: translateY(0); } }
@keyframes in-pop {
    0% { opacity: 0; transform: scale(0.9); }
    70% { opacity: 1; transform: scale(1.03); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes in-btn { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes in-side { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: translateX(0); } }
@keyframes in-stat { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes in-star {
    0% { transform: scale(0.2) rotate(-50deg); opacity: 0; }
    65% { transform: scale(1.2) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
}
@keyframes in-em {
    from { opacity: 0.35; filter: blur(4px); }
    to { opacity: 1; filter: blur(0); }
}
.badge-star { animation: in-star 0.9s cubic-bezier(0.16,1,0.3,1) 0.28s both; }
.hero h1 em { animation: in-em 1.2s cubic-bezier(0.16,1,0.3,1) 0.72s both; }

.appear--lede:not(.is-in) { animation-duration: 1.25s; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
    .appear, .hero-photo, .hero h1 em, .badge-star {
        opacity: 1 !important; transform: none !important;
        clip-path: none !important; filter: none !important;
    }
}

<script>
(function() {
    // 1. Each .appear commits to is-in on its own animationend
    document.querySelectorAll(".appear").forEach(function(el) {
        el.addEventListener("animationend", function() {
            el.classList.add("is-in");
        }, { once: true });
    });

    // 2. If animations don't run (reduced-motion / stale browser), force reveal
    requestAnimationFrame(function() {
        requestAnimationFrame(function() {
            var anyRunning = false;
            document.querySelectorAll(".appear").forEach(function(el) {
                if (typeof el.getAnimations === "function") {
                    var anims = el.getAnimations();
                    if (anims.some(function(a) {
                        return a.playState === "running" || a.playState === "finished";
                    })) {
                        anyRunning = true;
                    }
                }
            });
            if (!anyRunning) {
                document.querySelectorAll(".appear, .hero-photo").forEach(function(el) {
                    el.classList.add("is-in");
                });
            }
        });
    });

    // 3-5. Menu
    var burger = document.querySelector(".burger");
    var nav = document.getElementById("site-nav");
    var body = document.body;

    function setMenu(open) {
        body.classList.toggle("menu-open", open);
        burger.setAttribute("aria-expanded", open ? "true" : "false");
        burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    }

    burger.addEventListener("click", function() {
        setMenu(!body.classList.contains("menu-open"));
    });

    nav.querySelectorAll("a").forEach(function(a) {
        a.addEventListener("click", function() { setMenu(false); });
    });

    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") setMenu(false);
    });

    var mq = window.matchMedia("(min-width: 901px)");
    (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function(e) {
        if (e.matches) setMenu(false);
    });
})();
</script>
