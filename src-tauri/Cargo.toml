[package]
name = "s1mp1e"
version = "0.1.0"
description = "S1mp1e — liquid glass Minecraft launcher (1.8.9 → 26.2)"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# L2 install pipeline
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
futures-util = "0.3"
sha1_smol = "1"
zip = "2"
dirs = "5"
anyhow = "1"
# 靈動島封面：JPEG/PNG 解碼、縮圖、烤圓角後輸出 PNG（遊戲的 NativeImage 只讀 PNG）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }

# 遊戲內靈動島的「正在播放」：Windows 系統媒體控制（SMTC），Spotify 等播放器都會登記在這裡
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
